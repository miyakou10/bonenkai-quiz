<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>忘年会クイズ｜参加</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="player-body">
  <main class="player-shell">
    <header class="player-topbar"><span class="eyebrow">BONENKAI QUIZ</span><span class="room-pill">参加者</span></header>
    <section id="joinScreen" class="player-screen">
      <div class="hero-icon">🎉</div>
      <h1>忘年会クイズ</h1>
      <p class="lead">ニックネームを入力して参加してください。</p><input id="nickname" class="text-input" maxlength="12" placeholder="例：みや"
        autocomplete="off"><button id="joinBtn" class="btn btn-primary btn-large">参加する</button>
      <p id="joinError" class="error"></p>
    </section>
    <section id="waitingScreen" class="player-screen hidden">
      <div class="waiting-animation">🍻</div>
      <h2>参加しました！</h2>
      <p><strong id="playerName"></strong> さん</p>
      <p class="muted">幹事が問題を開始するまで<br>この画面で待ってください。</p>
    </section>
    <section id="questionScreen" class="player-screen hidden">
      <div class="player-question-meta"><span id="questionNo">Q1</span><span id="timer">--</span></div>
      <h2 id="question">問題</h2>
      <div id="choices" class="player-choices"></div>
      <p id="answerState" class="answer-state"></p>
    </section>
    <section id="resultScreen" class="player-screen hidden">
      <div id="resultIcon" class="result-icon">🎊</div>
      <h2 id="resultTitle">結果</h2>
      <div id="resultDetail" class="player-result-detail"></div>
      <p class="muted">次の問題を待っています…</p>
    </section>
    <section id="finalScreen" class="player-screen hidden">
      <div class="result-icon">🏆</div>
      <h2>最終結果</h2>
      <div id="finalDetail" class="player-result-detail"></div>
    </section>
  </main>
  <script type="module" src="player.js"></script>
</body>

</html>
