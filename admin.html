<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>忘年会クイズ｜管理者</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">
  <main class="admin-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">BONENKAI QUIZ / ADMIN</div>
        <h1>忘年会クイズ 管理者画面</h1>
      </div>
    </header>
    <section class="panel">
      <div class="admin-head">
        <div><span class="step">PARTICIPANTS</span>
          <h2>参加者</h2>
        </div>
        <div class="count-box"><span id="participantCount">0</span>人</div>
      </div>
      <div id="participantList" class="participant-list empty">参加者を待っています…</div>
    </section>
    <section class="panel current-panel">
      <div class="quiz-header">
        <div><span class="step" id="questionNumber">LOBBY</span>
          <h2 id="questionText">ゲーム開始待ち</h2>
        </div>
        <span id="timer"></span>
        <div class="timer-card"><span>回答済み</span><strong id="answeredCount">0 / 0</strong></div>
      </div>
      <div id="currentChoices" class="host-choices"></div>
      <div class="admin-actions"><button id="startBtn" class="btn btn-primary">第1問を開始</button>
        <button id="nextBtn" class="btn btn-primary hidden">次の問題へ</button>
        <button id="finalBtn" class="btn btn-primary hidden">最終結果を表示</button>
      </div>
    </section>
    <section id="finalPanel" class="panel final-panel hidden">
      <div class="section-heading">
        <div><span class="step">FINAL RESULT</span>
          <h2>総合結果</h2>
        </div>
      </div>
      <div id="finalResults"></div>
    </section>
    <footer class="admin-footer"><button id="resetBtn" class="text-button">ゲームをリセット</button></footer>
  </main>
  <script type="module" src="admin.js"></script>
</body>

</html>
